# UnboundAPI configuration

chat:
  broadcast:
    # If the prefix is empty or null, the message is sent without this format.
    format: "%plugin% &8» &f%message%"
    console: true

commands:
  enabled: true
  permission: "unboundapi.admin"

  tests:
    enabled: true
    chat: true
    menu: true
    animation: true
    item: true
    task: true
    cooldown: true
    config: true
    player: true
    sound: true

