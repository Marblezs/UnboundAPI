name: UnboundAPI
description: Shared utilities and developer API for Unbound plugins.
version: '${project.version}'
main: Unbound.unboundAPI.UnboundAPI
api-version: '1.21.11'
load: STARTUP
authors: [MarcyWu]

commands:
  unboundapi:
    description: UnboundAPI management and module test commands.
    usage: /unboundapi <help|tests|test|reload>
    aliases: [uapi]

permissions:
  unboundapi.admin:
    description: Allows access to UnboundAPI commands and module tests.
    default: op
